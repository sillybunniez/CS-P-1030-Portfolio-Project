<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
   <title>Bootstrap Example</title>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <!-- Using Bootstrap 5 framework -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
       rel="stylesheet">

   <!-- Bootstrap JavaScript -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

   <!-- jQuery used to load the navbar -->
   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
     <!-- Navbar gets added here -->
   <div id="nav-placeholder"></div>
   <!-- Web page content goes inside Bootstrap container(s) -->
   <div class="container text-center mb-5">
       <h1>My Projects</h1>
   </div>
   <script>
       // Load only the #site-nav element from navbar.html
       $("#nav-placeholder").load("navbar.html #site-nav");
   </script>
  <div class="card col-md-6 me-auto">
            <div class="card-header">
                <h3 class="card-title text-start">My Portfolio Project</h3>
            </div>
            <div class="card-body">
                <p class="card-text text-start">This website you're on is my portfolio project! This is my first ever college level project in computer science.</p>
            </div>
        </div>
</body>
</html>

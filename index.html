<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
   <title>Bootstrap Example</title>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <!-- Using Bootstrap 5 framework -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
       rel="stylesheet">

   <!-- Bootstrap JavaScript -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

   <!-- jQuery used to load the navbar -->
   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
     <!-- Navbar gets added here -->
     <div id="nav-placeholder"></div>
   <!-- Web page content goes inside Bootstrap container(s) -->
        <div class="container-fluid">
           <video src="videos/videotitle.mp4" autoplay loop></video>
        </div>
        <div class="container mt-3 ">
                <h1>Hello, I am Trevor Strand!</h1>
        </div>
        <div class="container">
                <div class="mt bg-danger text-white rounded">
                    <h2>Future Computer Science Major at MSU Denver
                    Career in IT
                    </h2>
                </div>
       </div>

   <script>
       // Load only the #site-nav element from navbar.html
       $("#nav-placeholder").load("navbar.html #site-nav");
   </script>
  <div class="container">
    <h2>I Am also a...</h2>
        <div class="card">
            <div class="card-body">
                <h3 class="card-title">Honor Student at Columbine High School</h3>
            </div>
        </div>
    </div>
</body>
</html>
